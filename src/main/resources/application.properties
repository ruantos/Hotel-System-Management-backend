spring.application.name=hotel-management
server.port=${PORT:8080}
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL}

spring.jpa.hibernate.ddl-auto=update
app.hotel.time-zone=${HOTEL_TIME_ZONE:America/Recife}

app.bootstrap.receptionist.enabled=${BOOTSTRAP_RECEPTIONIST_ENABLED:false}
app.bootstrap.receptionist.name=${BOOTSTRAP_RECEPTIONIST_NAME:}
app.bootstrap.receptionist.email=${BOOTSTRAP_RECEPTIONIST_EMAIL:}
app.bootstrap.receptionist.password=${BOOTSTRAP_RECEPTIONIST_PASSWORD:}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

springdoc.swagger-ui.path=/swagger-ui-generated.html
springdoc.swagger-ui.with-credentials=true
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.override-with-generic-response=false

app.password-reset.enabled=${PASSWORD_RESET_ENABLED:false}
app.password-reset.frontend-url=${PASSWORD_RESET_FRONTEND_URL:http://localhost:3000/redefinir-senha}
app.password-reset.from=${PASSWORD_RESET_FROM:no-reply@hotel.example}
app.password-reset.token-ttl=${PASSWORD_RESET_TOKEN_TTL:15m}
app.password-reset.resend-cooldown=${PASSWORD_RESET_RESEND_COOLDOWN:60s}

spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties[mail.smtp.auth]=${SMTP_AUTH:true}
spring.mail.properties[mail.smtp.starttls.enable]=${SMTP_STARTTLS_ENABLED:true}
spring.mail.properties[mail.smtp.starttls.required]=${SMTP_STARTTLS_ENABLED:true}
spring.mail.properties[mail.smtp.ssl.enable]=${SMTP_SSL_ENABLED:false}
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=5000
spring.mail.properties[mail.smtp.writetimeout]=5000
